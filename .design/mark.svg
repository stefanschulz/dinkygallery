<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="DinkyGallery">
	<title>DinkyGallery</title>
	<!-- Reduced from logo.svg for small sizes (favicon, JED listing thumbnail): the
	     framed image collapses to one solid block - interior detail does not survive at
	     16px - kept between the lightbox's previous / next chevrons. currentColor so it
	     recolours with its context. -->
	<rect x="7" y="6" width="10" height="12" rx="2.5" fill="currentColor" stroke="none"/>
	<path d="M4.5 8.5 L2.5 12 L4.5 15.5"/>
	<path d="M19.5 8.5 L21.5 12 L19.5 15.5"/>
</svg>

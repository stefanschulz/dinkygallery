PLG_CONTENT_DINKYGALLERY="Content - DinkyGallery"
PLG_CONTENT_DINKYGALLERY_XML_DESCRIPTION="Renders {gallery ...} shortcodes in articles as an in-article card carousel with a click-through lightbox. Zero third-party JavaScript; configured entirely through the parameters below."

PLG_CONTENT_DINKYGALLERY_FIELDSET_LIGHTBOX_LABEL="Lightbox"
PLG_CONTENT_DINKYGALLERY_FIELDSET_LIGHTBOX_DESC="Appearance and behaviour of the click-through image viewer."

PLG_CONTENT_DINKYGALLERY_FIELDSET_THUMBNAILS_LABEL="Thumbnails"
PLG_CONTENT_DINKYGALLERY_FIELDSET_THUMBNAILS_DESC="Cached, size-scaled copies of the originals so pages do not download full-resolution images. Requires the GD extension."

PLG_CONTENT_DINKYGALLERY_ARIA_CAROUSEL="Image gallery"
PLG_CONTENT_DINKYGALLERY_ARIA_PREV="Previous image"
PLG_CONTENT_DINKYGALLERY_ARIA_NEXT="Next image"
PLG_CONTENT_DINKYGALLERY_ARIA_CLOSE="Close"
PLG_CONTENT_DINKYGALLERY_ARIA_DIALOG="Image viewer"
PLG_CONTENT_DINKYGALLERY_ARIA_POSITION="Image %1$s of %2$s"

PLG_CONTENT_DINKYGALLERY_PARAM_BASE_DIRECTORY_LABEL="Base media directory"
PLG_CONTENT_DINKYGALLERY_PARAM_BASE_DIRECTORY_DESC="Folder that gallery names in the shortcode resolve under, relative to the site root (e.g. images or images/stories). A gallery whose resolved path escapes this folder is rejected. The shortcode cannot override it."

PLG_CONTENT_DINKYGALLERY_PARAM_IMAGE_EXTENSIONS_LABEL="Image extensions"
PLG_CONTENT_DINKYGALLERY_PARAM_IMAGE_EXTENSIONS_DESC="Comma-separated list of file extensions treated as images, case-insensitive. Everything else in a gallery folder (including dotfiles) is ignored."

PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_LABEL="Sort order"
PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_DESC="Order of the images within a gallery, by filename, natural sort. Overridable per shortcode with sort=asc|desc."
PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_OPT_ASC="Ascending (A to Z)"
PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_OPT_DESC="Descending (Z to A)"

PLG_CONTENT_DINKYGALLERY_PARAM_VISIBLE_CARDS_LABEL="Visible cards"
PLG_CONTENT_DINKYGALLERY_PARAM_VISIBLE_CARDS_DESC="How many cards the carousel shows at once on a wide viewport. Narrow viewports step this down automatically. Overridable per shortcode with cards=N."

PLG_CONTENT_DINKYGALLERY_PARAM_CARD_ASPECT_LABEL="Card aspect ratio"
PLG_CONTENT_DINKYGALLERY_PARAM_CARD_ASPECT_DESC="Shape of a carousel card's image box. Images are cropped to fill it (object-fit: cover). Overridable per shortcode with aspect=."

PLG_CONTENT_DINKYGALLERY_PARAM_CARD_MIN_LABEL="Minimum card width"
PLG_CONTENT_DINKYGALLERY_PARAM_CARD_MIN_DESC="A CSS length (e.g. 13rem). The carousel drops its column count rather than let a card get narrower than this."

PLG_CONTENT_DINKYGALLERY_PARAM_CARD_GAP_LABEL="Gap between cards"
PLG_CONTENT_DINKYGALLERY_PARAM_CARD_GAP_DESC="CSS length for the space between carousel cards, e.g. 0, 12px or 1rem. Default 0 (cards touch). A value without a unit is ignored. Overridable per shortcode with gap=."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_SIZE_LABEL="Lightbox size"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_SIZE_DESC="Size of the lightbox frame as a percentage of the viewport. 100 fills it. The frame stays this fixed size; the image is fitted inside by aspect ratio. Overridable per shortcode with size=X."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_ASPECT_LABEL="Lightbox shape"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_ASPECT_DESC="Shape of the lightbox frame within the size above. 'viewport' (default) makes it X vw by X vh, i.e. the browser's proportions. A ratio like 4/3, 3:2 or 1.5 gives the frame that fixed shape on any screen. 'image' resizes the frame to each image's own ratio, so there is no mat."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_COLOR_LABEL="Lightbox base colour"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_COLOR_DESC="Colour of the dimmed lightbox mat. The backdrop opacity below is applied to it. Default black."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_PADDING_LABEL="Lightbox padding"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_PADDING_DESC="A CSS length keeping the image clear of the lightbox edge, e.g. 10px or 1rem. Default 10px. A value without a unit is ignored."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_LOOP_LABEL="Loop previous / next"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_LOOP_DESC="Wrap around from the last image to the first (and back), in both the carousel and the lightbox. Off: the arrow or navigation zone at the respective end is disabled. Overridable per shortcode with loop=0|1."

PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_LABEL="Middle click zone"
PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_DESC="What a click on the centre third of the lightbox does. The left third is always previous, the right third always next. Overridable per shortcode with middle=none|close."
PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_NONE="Nothing"
PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_CLOSE="Close the lightbox"

PLG_CONTENT_DINKYGALLERY_PARAM_BACKDROP_OPACITY_LABEL="Backdrop opacity"
PLG_CONTENT_DINKYGALLERY_PARAM_BACKDROP_OPACITY_DESC="How strongly the dimmed page behind the lightbox is darkened, in percent."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMBNAILS_LABEL="Generate thumbnails"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMBNAILS_DESC="Serve cached, size-scaled copies (with a responsive srcset) instead of the full-size originals. Copies are written to a subfolder of each gallery folder and regenerated automatically when an image is replaced. Off: the originals are served as before."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_DIR_LABEL="Cache subfolder"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_DIR_DESC="Name of the folder, created inside each gallery folder, that holds the generated copies. One path segment; a leading dot keeps it out of the image listing. Default .thumbs."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_WIDTHS_LABEL="Card widths"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_WIDTHS_DESC="Comma-separated pixel widths generated for the carousel srcset. Widths at or above an image's own width are skipped. Default 480,768,1024,1600."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_LARGE_LABEL="Lightbox size cap"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_LARGE_DESC="Longest edge, in pixels, of the copy the lightbox loads. Images below this are used as-is. 0 loads the untouched original. Default 1920."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_QUALITY_LABEL="JPEG / WebP quality"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_QUALITY_DESC="Encoder quality for generated JPEG and WebP copies, 1-100 (PNG and GIF keep lossless). Default 82."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_PRUNE_LABEL="Prune stale copies"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_PRUNE_DESC="After listing a folder, delete generated copies that are no longer current - a replaced image, a dropped width or a removed original. Off: old copies stay on disk until the cache subfolder is deleted by hand."

PLG_CONTENT_DINKYGALLERY_PARAM_DEBUG_LABEL="Debug comment"
PLG_CONTENT_DINKYGALLERY_PARAM_DEBUG_DESC="Emit an HTML comment near each processed shortcode listing the decision trail (folder, resolved path, image count, why a gallery was skipped). For diagnostics only - turn off in production."

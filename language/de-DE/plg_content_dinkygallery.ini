PLG_CONTENT_DINKYGALLERY="Content - DinkyGallery"
PLG_CONTENT_DINKYGALLERY_XML_DESCRIPTION="Wandelt {gallery ...}-Kurzcodes in Beitraegen in ein Karten-Karussell im Artikel mit anklickbarer Lightbox um. Kein Fremd-JavaScript; vollstaendig ueber die folgenden Parameter konfigurierbar."

PLG_CONTENT_DINKYGALLERY_FIELDSET_LIGHTBOX_LABEL="Lightbox"
PLG_CONTENT_DINKYGALLERY_FIELDSET_LIGHTBOX_DESC="Aussehen und Verhalten der anklickbaren Bildansicht."

PLG_CONTENT_DINKYGALLERY_FIELDSET_THUMBNAILS_LABEL="Thumbnails"
PLG_CONTENT_DINKYGALLERY_FIELDSET_THUMBNAILS_DESC="Zwischengespeicherte, herunterskalierte Kopien der Originale, damit Seiten keine Bilder in voller Aufloesung laden. Benoetigt die GD-Erweiterung."

PLG_CONTENT_DINKYGALLERY_ARIA_CAROUSEL="Bildergalerie"
PLG_CONTENT_DINKYGALLERY_ARIA_PREV="Vorheriges Bild"
PLG_CONTENT_DINKYGALLERY_ARIA_NEXT="Naechstes Bild"
PLG_CONTENT_DINKYGALLERY_ARIA_CLOSE="Schliessen"
PLG_CONTENT_DINKYGALLERY_ARIA_DIALOG="Bildansicht"
PLG_CONTENT_DINKYGALLERY_ARIA_POSITION="Bild %1$s von %2$s"

PLG_CONTENT_DINKYGALLERY_PARAM_BASE_DIRECTORY_LABEL="Basis-Medienverzeichnis"
PLG_CONTENT_DINKYGALLERY_PARAM_BASE_DIRECTORY_DESC="Ordner, unter dem die Galerienamen aus dem Kurzcode aufgeloest werden, relativ zum Website-Stammverzeichnis (z. B. images oder images/stories). Eine Galerie, deren aufgeloester Pfad diesen Ordner verlaesst, wird abgewiesen. Der Kurzcode kann dies nicht ueberschreiben."

PLG_CONTENT_DINKYGALLERY_PARAM_IMAGE_EXTENSIONS_LABEL="Bild-Dateiendungen"
PLG_CONTENT_DINKYGALLERY_PARAM_IMAGE_EXTENSIONS_DESC="Kommagetrennte Liste der als Bild behandelten Dateiendungen, Gross-/Kleinschreibung egal. Alles andere im Galerieordner (auch versteckte Dateien) wird ignoriert."

PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_LABEL="Sortierreihenfolge"
PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_DESC="Reihenfolge der Bilder innerhalb einer Galerie, nach Dateiname, natuerliche Sortierung. Pro Kurzcode ueberschreibbar mit sort=asc|desc."
PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_OPT_ASC="Aufsteigend (A bis Z)"
PLG_CONTENT_DINKYGALLERY_PARAM_SORT_ORDER_OPT_DESC="Absteigend (Z bis A)"

PLG_CONTENT_DINKYGALLERY_PARAM_VISIBLE_CARDS_LABEL="Sichtbare Karten"
PLG_CONTENT_DINKYGALLERY_PARAM_VISIBLE_CARDS_DESC="Wie viele Karten das Karussell auf einem breiten Viewport gleichzeitig zeigt. Schmale Viewports reduzieren diesen Wert automatisch. Pro Kurzcode ueberschreibbar mit cards=N."

PLG_CONTENT_DINKYGALLERY_PARAM_CARD_ASPECT_LABEL="Seitenverhaeltnis der Karte"
PLG_CONTENT_DINKYGALLERY_PARAM_CARD_ASPECT_DESC="Form des Bildkastens einer Karussellkarte. Bilder werden fuellend zugeschnitten (object-fit: cover). Pro Kurzcode ueberschreibbar mit aspect=."

PLG_CONTENT_DINKYGALLERY_PARAM_CARD_MIN_LABEL="Minimale Kartenbreite"
PLG_CONTENT_DINKYGALLERY_PARAM_CARD_MIN_DESC="Eine CSS-Laenge (z. B. 13rem). Das Karussell verringert die Spaltenzahl, statt eine Karte schmaler als diesen Wert werden zu lassen."

PLG_CONTENT_DINKYGALLERY_PARAM_CARD_GAP_LABEL="Abstand zwischen Karten"
PLG_CONTENT_DINKYGALLERY_PARAM_CARD_GAP_DESC="CSS-Laenge fuer den Abstand zwischen den Karussellkarten, z. B. 0, 12px oder 1rem. Standard 0 (Karten stossen aneinander). Ein Wert ohne Einheit wird ignoriert. Pro Kurzcode ueberschreibbar mit gap=."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_SIZE_LABEL="Lightbox-Groesse"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_SIZE_DESC="Groesse des Lightbox-Rahmens als Prozent des Viewports. 100 fuellt ihn. Der Rahmen behaelt diese feste Groesse; das Bild wird nach Seitenverhaeltnis eingepasst. Pro Kurzcode ueberschreibbar mit size=X."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_ASPECT_LABEL="Lightbox-Form"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_ASPECT_DESC="Form des Lightbox-Rahmens innerhalb der Groesse oben. 'viewport' (Standard) macht ihn X vw mal X vh, also in den Proportionen des Browsers. Ein Verhaeltnis wie 4/3, 3:2 oder 1.5 gibt dem Rahmen auf jedem Bildschirm diese feste Form. 'image' passt den Rahmen an das Seitenverhaeltnis jedes Bildes an, sodass keine Matte entsteht."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_COLOR_LABEL="Lightbox-Grundfarbe"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_COLOR_DESC="Farbe der abgedunkelten Lightbox-Flaeche. Die Deckkraft unten wird darauf angewendet. Standard Schwarz."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_PADDING_LABEL="Lightbox-Innenabstand"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_PADDING_DESC="Eine CSS-Laenge, die das Bild vom Rand der Lightbox freihaelt, z. B. 10px oder 1rem. Standard 10px. Ein Wert ohne Einheit wird ignoriert."

PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_LOOP_LABEL="Vor / Zurueck umlaufend"
PLG_CONTENT_DINKYGALLERY_PARAM_LIGHTBOX_LOOP_DESC="Vom letzten Bild zum ersten springen (und zurueck), im Karussell wie in der Lightbox. Aus: Der Pfeil bzw. die Navigationszone am jeweiligen Ende ist deaktiviert. Pro Kurzcode ueberschreibbar mit loop=0|1."

PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_LABEL="Mittlere Klickzone"
PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_DESC="Was ein Klick auf das mittlere Drittel der Lightbox bewirkt. Das linke Drittel ist immer Zurueck, das rechte immer Vor. Pro Kurzcode ueberschreibbar mit middle=none|close."
PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_NONE="Nichts"
PLG_CONTENT_DINKYGALLERY_PARAM_MIDDLE_ZONE_ACTION_CLOSE="Lightbox schliessen"

PLG_CONTENT_DINKYGALLERY_PARAM_BACKDROP_OPACITY_LABEL="Deckkraft des Hintergrunds"
PLG_CONTENT_DINKYGALLERY_PARAM_BACKDROP_OPACITY_DESC="Wie stark die abgedunkelte Seite hinter der Lightbox verdunkelt wird, in Prozent."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMBNAILS_LABEL="Thumbnails erzeugen"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMBNAILS_DESC="Liefert zwischengespeicherte, herunterskalierte Kopien (mit responsivem srcset) statt der Originale in voller Groesse. Die Kopien liegen in einem Unterordner des jeweiligen Galerieordners und werden automatisch neu erzeugt, wenn ein Bild ersetzt wird. Aus: Die Originale werden wie bisher ausgeliefert."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_DIR_LABEL="Cache-Unterordner"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_DIR_DESC="Name des Ordners, der in jedem Galerieordner angelegt wird und die erzeugten Kopien enthaelt. Ein Pfadsegment; ein fuehrender Punkt haelt ihn aus der Bildliste heraus. Standard .thumbs."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_WIDTHS_LABEL="Kartenbreiten"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_WIDTHS_DESC="Kommagetrennte Pixelbreiten fuer das srcset des Karussells. Breiten ab der Eigenbreite eines Bildes werden uebersprungen. Standard 480,768,1024,1600."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_LARGE_LABEL="Lightbox-Groessenlimit"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_LARGE_DESC="Laengste Kante der Kopie, die die Lightbox laedt, in Pixeln. Kleinere Bilder werden unveraendert genutzt. 0 laedt das unveraenderte Original. Standard 1920."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_QUALITY_LABEL="JPEG-/WebP-Qualitaet"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_QUALITY_DESC="Encoder-Qualitaet fuer erzeugte JPEG- und WebP-Kopien, 1-100 (PNG und GIF bleiben verlustfrei). Standard 82."

PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_PRUNE_LABEL="Veraltete Kopien entfernen"
PLG_CONTENT_DINKYGALLERY_PARAM_THUMB_PRUNE_DESC="Nach dem Auflisten eines Ordners erzeugte Kopien loeschen, die nicht mehr aktuell sind - ersetztes Bild, entfernte Breite oder geloeschtes Original. Aus: Alte Kopien bleiben liegen, bis der Cache-Unterordner von Hand geloescht wird."

PLG_CONTENT_DINKYGALLERY_PARAM_DEBUG_LABEL="Debug-Kommentar"
PLG_CONTENT_DINKYGALLERY_PARAM_DEBUG_DESC="Gibt bei jedem verarbeiteten Kurzcode einen HTML-Kommentar mit der Entscheidungskette aus (Ordner, aufgeloester Pfad, Bildanzahl, Grund fuer das Ueberspringen). Nur zur Diagnose - in der Produktion abschalten."

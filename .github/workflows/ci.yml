name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and XML (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find src services tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML configuration files parse
        run: |
          php -r 'foreach (array_slice($argv, 1) as $file) { if (simplexml_load_file($file) === false) { exit(1); } echo "ok  $file\n"; }' \
            dinkygallery.xml build.xml phpcs.xml.dist phpunit.xml.dist
      - name: Language files cover every manifest key
        shell: bash
        run: |
          set -euo pipefail
          for key in $(grep -oE 'PLG_CONTENT_DINKYGALLERY_[A-Z0-9_]+' dinkygallery.xml | sort -u); do
            grep -q "^${key}=" language/en-GB/plg_content_dinkygallery.ini || {
              echo "::error::Missing en-GB language key ${key}"; exit 1;
            }
            grep -q "^${key}=" language/de-DE/plg_content_dinkygallery.ini || {
              echo "::error::Missing de-DE language key ${key}"; exit 1;
            }
          done
          diff -u \
            <(grep -oE '^PLG_CONTENT_DINKYGALLERY_[A-Z0-9_]+' language/en-GB/plg_content_dinkygallery.ini | sort) \
            <(grep -oE '^PLG_CONTENT_DINKYGALLERY_[A-Z0-9_]+' language/de-DE/plg_content_dinkygallery.ini | sort)

  standard:
    name: Coding standard (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test

  parity:
    name: Render, CSS and JavaScript contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/parity/contract.mjs

  package:
    name: Build and check the extension ZIP
    runs-on: ubuntu-latest
    needs: [syntax, standard, unit, parity]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer
      - name: Read package version from the manifest
        id: package_version
        run: echo "version=$(php -r '$xml = simplexml_load_file("dinkygallery.xml"); if (!$xml) { exit(1); } echo (string) $xml->version;')" >> "$GITHUB_OUTPUT"
      - name: Install Phing
        run: |
          composer global require --no-interaction phing/phing:^3.0
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"
      - run: phing package
      - name: Validate the archive contents
        shell: bash
        run: |
          set -euo pipefail
          package=".releases/plg_content_dinkygallery-${VERSION}.zip"
          test -f "$package" || { echo "::error::Missing package ZIP: $package"; exit 1; }
          unzip -tq "$package"
          contents="$(unzip -Z1 "$package")"
          for required in dinkygallery.xml services/provider.php src/Extension/DinkyGallery.php \
            src/Helper/Thumbnailer.php media/plg_content_dinkygallery/css/dinkygallery.css \
            media/plg_content_dinkygallery/js/dinkygallery.js \
            language/en-GB/plg_content_dinkygallery.ini language/de-DE/plg_content_dinkygallery.ini LICENSE.txt; do
            grep -Fxq "$required" <<< "$contents" || { echo "::error::Package is missing $required"; exit 1; }
          done
          if grep -Eq '(^|/)(tests|vendor)/|(^|/)composer\.(json|lock)$' <<< "$contents"; then
            echo "::error::Development files were included in the package"; exit 1;
          fi
          php -r '
            $manifest = simplexml_load_file("dinkygallery.xml");
            $updates = simplexml_load_file(".releases/update.xml");
            $entry = $updates->update ?? null;
            $package = $argv[1];
            if (!$manifest || !$entry || (string) $entry->element !== "dinkygallery"
                || (string) $entry->folder !== "content"
                || (string) $entry->version !== (string) $manifest->version
                || !hash_equals((string) $entry->sha256, hash_file("sha256", $package))) {
                fwrite(STDERR, "Generated update.xml does not match the manifest and ZIP.\n"); exit(1);
            }
          ' "$package"
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: plg-content-dinkygallery-package
          include-hidden-files: true
          path: |
            .releases/plg_content_dinkygallery-${{ steps.package_version.outputs.version }}.zip
            .releases/update.xml
          if-no-files-found: error

  integration:
    name: Joomla integration (Joomla ${{ matrix.joomla }})
    runs-on: ubuntu-latest
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5', '6']
    env:
      JOOMLA_TAG: ${{ matrix.joomla }}
      COMPOSE_FILE: tests/Integration/compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plg-content-dinkygallery-package
          path: .releases
      - name: Start Joomla and prepare fixture images
        run: bash tests/Integration/ci-seed.sh
      - name: Run Joomla integration checks
        run: docker compose exec -T joomla php /repo/tests/Integration/gallery.php
      - name: Joomla logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
